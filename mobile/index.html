<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>P-ARCHIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="row">
        <span class="brand">P-ARCHIVE</span>
        <span class="tag" id="game-tag"></span>
      </div>
      <div class="row sub">
        <span class="status"><i class="dot" id="dot"></i><span id="status-text">불러오는 중…</span></span>
        <span class="mix" id="mix">Phoenix 2</span>
      </div>
      <button type="button" class="refresh" id="refresh">기록 갱신</button>
    </header>

    <!-- 1. 기록표 -->
    <section class="tab" id="tab-board">
      <div class="seg" role="tablist">
        <button type="button" class="seg-btn single" data-type="Single">SINGLE</button>
        <button type="button" class="seg-btn double" data-type="Double">DOUBLE</button>
      </div>

      <nav class="chips" id="chips" aria-label="레벨 선택"></nav>

      <div class="tools">
        <div class="pair" role="group" aria-label="보기 방식">
          <button type="button" class="tool icon" data-view="grid" aria-label="격자 보기">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" /><rect x="9" y="2" width="5" height="5" rx="1" /><rect x="2" y="9" width="5" height="5" rx="1" /><rect x="9" y="9" width="5" height="5" rx="1" /></svg>
          </button>
          <button type="button" class="tool icon" data-view="list" aria-label="목록 보기">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" /></svg>
          </button>
        </div>
        <label class="tool select" id="sort-wrap">
          <select id="sort" aria-label="정렬">
            <option value="score">점수순</option>
            <option value="name">이름순</option>
            <option value="grade">등급순</option>
          </select>
          <span aria-hidden="true">▾</span>
        </label>
        <button type="button" class="tool" id="names" aria-pressed="true">곡명 ON</button>
        <div class="pair end" role="group" aria-label="곡명 언어">
          <button type="button" class="tool lang" data-lang="ko">한</button>
          <button type="button" class="tool lang" data-lang="en">영</button>
        </div>
      </div>

      <section class="summary" aria-label="요약">
        <div class="sum-head"><span id="sum-label"></span><span class="sum-count"><b id="sum-clear">0</b><span> / <span id="sum-total">0</span></span></span></div>
        <div class="bands" id="bands"></div>
        <div class="plates" id="plates"></div>
      </section>

      <div id="board"></div>
    </section>

    <!-- 2. 최근 플레이 (B4) -->
    <section class="tab" id="tab-recent" hidden>
      <p class="empty-note">최근 플레이 화면은 준비 중이에요.</p>
    </section>

    <!-- 3. 통계 (B4) -->
    <section class="tab" id="tab-stats" hidden>
      <p class="empty-note">통계 화면은 준비 중이에요.</p>
    </section>

    <footer class="foot">
      <button type="button" class="link" id="logout">로그아웃 · 저장된 로그인 정보 지우기</button>
    </footer>

    <nav class="tabbar" aria-label="메인 메뉴">
      <button type="button" data-tab="board">기록표</button>
      <button type="button" data-tab="recent">최근 플레이</button>
      <button type="button" data-tab="stats">통계</button>
    </nav>

    <dialog id="login">
      <form method="dialog" id="login-form">
        <h2>piugame 로그인</h2>
        <p class="hint">AM-PASS 계정으로 로그인해요. 비밀번호는 piugame.com에만 보내요.</p>
        <label>아이디<input name="username" autocomplete="username" required /></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required /></label>
        <label class="check"><input name="remember" type="checkbox" /> 로그인 정보 기억 (이 폰의 보안 저장소에 저장)</label>
        <p class="error" id="login-error"></p>
        <div class="btns">
          <button type="button" value="cancel" id="login-cancel">취소</button>
          <button type="submit" class="primary">로그인</button>
        </div>
      </form>
    </dialog>

    <div class="overlay" id="progress" hidden>
      <div class="box"><div class="spinner"></div><p id="progress-text"></p></div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
